name: Publish

# Publica en PyPI automáticamente al crear un tag v*.
# Requiere "Trusted Publishing" habilitado en el proyecto PyPI
# (https://docs.pypi.org/trusted-publishers/) apuntando a este repo/workflow.
on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build package
        run: |
          pip install build
          python -m build

      - name: Check if version already published
        id: check-pypi
        run: |
          VERSION="$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          if curl -sSf "https://pypi.org/pypi/youber/json" > /dev/null 2>&1 && \
             curl -sS "https://pypi.org/pypi/youber/json" | python -c "import json,sys; print(json.load(sys.stdin)['info']['version'])" | grep -qx "$VERSION"; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "La versión $VERSION ya está publicada en PyPI; se omite la subida."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to PyPI
        if: steps.check-pypi.outputs.skip != 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
