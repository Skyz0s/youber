name: Publish

# Publica en PyPI automáticamente al crear un tag v*.
# Requiere "Trusted Publishing" habilitado en el proyecto PyPI
# (https://docs.pypi.org/trusted-publishers/) apuntando a este repo/workflow.
on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build package
        run: |
          pip install build
          python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
